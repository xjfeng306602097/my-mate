openapi: 3.1.0
info:
  title: My Mate Control Plane API
  version: 0.1.0
  description: >
    Draft API contract for the My Mate workflow control plane.

servers:
  - url: https://api.my-mate.local

tags:
  - name: Templates
  - name: Runs
  - name: Mobile
  - name: Approvals
  - name: HumanInputs
  - name: Planner
  - name: Agents
  - name: Sessions
  - name: Diagnostics
  - name: Evaluation
  - name: Observability
  - name: Identity
  - name: Workspaces
  - name: Governance
  - name: InternalOps

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
    WorkspaceRole:
      type: string
      enum: [owner, admin, operator, viewer]
    WorkspacePermission:
      type: string
      enum: [workspace.read, workspace.manage_members, registry.manage, governance.review, mission.create, mission.edit, run.create, run.control, run.evaluate, gate.resolve, audit.read]
    AuthenticatedPrincipal:
      type: object
      properties:
        principal_id: { type: string }
        display_name: { type: string }
        principal_type:
          type: string
          enum: [user, service, development]
      required: [principal_id, display_name, principal_type]
    WorkspaceMembership:
      type: object
      properties:
        workspace_id: { type: string }
        workspace_name: { type: string }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
      required: [workspace_id, workspace_name, role]
    AuthMeResponse:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        principal:
          $ref: "#/components/schemas/AuthenticatedPrincipal"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembership"
        selected_workspace:
          $ref: "#/components/schemas/WorkspaceMembership"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/WorkspacePermission"
        auth_method:
          type: string
          enum: [bearer, development]
        issued_at: { type: string, format: date-time }
        request_id: { type: string }
        available_workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembership"
      required: [schema_version, principal, memberships, selected_workspace, permissions, auth_method, issued_at, request_id, available_workspaces]
    WorkspaceRecord:
      type: object
      properties:
        workspace_id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [active, archived]
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [workspace_id, name, status, created_by, created_at, updated_at]
    WorkspaceMemberRecord:
      type: object
      properties:
        workspace_id: { type: string }
        principal_id: { type: string }
        display_name: { type: string }
        principal_type:
          type: string
          enum: [user, service, development]
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status:
          type: string
          enum: [active, revoked]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [workspace_id, principal_id, display_name, principal_type, role, status, created_at, updated_at]
    CreateWorkspaceRequest:
      type: object
      properties:
        workspace_id: { type: string }
        name: { type: string }
      required: [workspace_id, name]
    UpdateWorkspaceMemberRequest:
      type: object
      properties:
        display_name: { type: string }
        principal_type:
          type: string
          enum: [user, service, development]
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status:
          type: string
          enum: [active, revoked]
      required: [role]
    SecurityAuditEvent:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        audit_id: { type: string }
        workspace_id: { type: string }
        principal_id: { type: string }
        principal_type:
          type: string
          enum: [user, service, development, unknown]
        action: { type: string }
        permission:
          oneOf:
            - $ref: "#/components/schemas/WorkspacePermission"
            - type: "null"
        method: { type: string }
        path: { type: string }
        resource_type: { type: [string, "null"] }
        resource_id: { type: [string, "null"] }
        outcome:
          type: string
          enum: [allowed, denied, error]
        status_code: { type: integer }
        request_id: { type: string }
        metadata:
          type: object
          additionalProperties:
            type: [string, number, boolean, "null"]
        previous_hash: { type: [string, "null"] }
        hash: { type: string }
        created_at: { type: string, format: date-time }
      required: [schema_version, audit_id, workspace_id, principal_id, principal_type, action, permission, method, path, resource_type, resource_id, outcome, status_code, request_id, metadata, previous_hash, hash, created_at]
    GovernanceMode:
      type: string
      enum: [advisory, enforced]
    GovernanceProtectedAction:
      type: string
      enum: [agent_profile.upsert, agent_profile.disable, skill.upsert, skill.disable, template.publish, template.archive]
    GovernanceChangeStatus:
      type: string
      enum: [pending, approved, rejected, applied, conflicted]
    GovernancePolicyRecord:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        workspace_id: { type: string }
        mode:
          $ref: "#/components/schemas/GovernanceMode"
        required_approvals: { type: integer, minimum: 1, maximum: 5 }
        allow_self_approval: { type: boolean }
        protected_actions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GovernanceProtectedAction"
        updated_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [schema_version, workspace_id, mode, required_approvals, allow_self_approval, protected_actions, updated_by, created_at, updated_at]
    UpdateGovernancePolicyRequest:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/GovernanceMode"
        required_approvals: { type: integer, minimum: 1, maximum: 5 }
        allow_self_approval: { type: boolean }
        protected_actions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GovernanceProtectedAction"
    GovernanceApprovalRecord:
      type: object
      properties:
        principal_id: { type: string }
        decision:
          type: string
          enum: [approved, rejected]
        comment: { type: [string, "null"] }
        decided_at: { type: string, format: date-time }
      required: [principal_id, decision, comment, decided_at]
    GovernanceChangeRecord:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        change_id: { type: string }
        workspace_id: { type: string }
        action:
          $ref: "#/components/schemas/GovernanceProtectedAction"
        resource_type:
          type: string
          enum: [agent_profile, skill, template]
        resource_id: { type: string }
        reason: { type: string }
        payload:
          type: object
          additionalProperties: true
        payload_digest: { type: string }
        base_digest: { type: string }
        status:
          $ref: "#/components/schemas/GovernanceChangeStatus"
        required_approvals: { type: integer, minimum: 1, maximum: 5 }
        allow_self_approval: { type: boolean }
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceApprovalRecord"
        proposed_by: { type: string }
        proposed_at: { type: string, format: date-time }
        approved_at: { type: [string, "null"], format: date-time }
        applied_by: { type: [string, "null"] }
        applied_at: { type: [string, "null"], format: date-time }
        result:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        conflict_reason: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
      required: [schema_version, change_id, workspace_id, action, resource_type, resource_id, reason, payload, payload_digest, base_digest, status, required_approvals, allow_self_approval, approvals, proposed_by, proposed_at, approved_at, applied_by, applied_at, result, conflict_reason, updated_at]
    CreateGovernanceChangeRequest:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/GovernanceProtectedAction"
        resource_id: { type: string }
        reason: { type: string, minLength: 1 }
        payload:
          type: object
          additionalProperties: true
      required: [action, resource_id, reason]
    GovernanceDecisionRequest:
      type: object
      properties:
        comment: { type: string }
    GovernanceChangeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceChangeRecord"
        policy:
          $ref: "#/components/schemas/GovernancePolicyRecord"
      required: [items, policy]
    DashboardObservabilityQuery:
      type: object
      properties:
        window_hours:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 720
          description: Null preserves the legacy all-run reliability scope; supplied values filter indexed runs by overlapping runtime window.
        status:
          type: string
          enum: [all, active, terminal, completed, failed, cancelled]
        correlation_limit:
          type: integer
          minimum: 1
          maximum: 100
        index_schema_version:
          type: integer
          const: 2
        indexed_runs:
          type: integer
          minimum: 0
        rebuilt_runs:
          type: integer
          minimum: 0
        compare:
          type: string
          enum: [none, previous]
      required:
        - window_hours
        - status
        - correlation_limit
        - index_schema_version
        - indexed_runs
        - rebuilt_runs
        - compare
    DashboardObservabilityRetention:
      type: object
      properties:
        enabled:
          type: boolean
        applied:
          type: boolean
        retention_hours:
          type:
            - integer
            - "null"
          minimum: 1
        cutoff_at:
          type:
            - string
            - "null"
          format: date-time
        retained_runs:
          type: integer
          minimum: 0
        excluded_runs:
          type: integer
          minimum: 0
        pruned_indexes:
          type: integer
          minimum: 0
        pruned_dirty_markers:
          type: integer
          minimum: 0
        canonical_data_retained:
          type: boolean
          const: true
      required: [enabled, applied, retention_hours, cutoff_at, retained_runs, excluded_runs, pruned_indexes, pruned_dirty_markers, canonical_data_retained]
    DashboardComparisonMetric:
      type: object
      properties:
        current:
          type: [number, "null"]
        previous:
          type: [number, "null"]
        delta:
          type: [number, "null"]
        change_rate:
          type: [number, "null"]
        direction:
          type: string
          enum: [up, down, flat, unavailable]
        outcome:
          type: string
          enum: [improved, regressed, neutral, unavailable]
      required: [current, previous, delta, change_rate, direction, outcome]
    DashboardObservabilityComparison:
      type:
        - object
        - "null"
      properties:
        mode:
          type: string
          const: previous_period
        coverage:
          type: string
          enum: [complete, partial]
        previous_window:
          type: object
          properties:
            started_at:
              type: string
              format: date-time
            ended_at:
              type: string
              format: date-time
          required: [started_at, ended_at]
        metrics:
          type: object
          properties:
            runs_observed:
              $ref: "#/components/schemas/DashboardComparisonMetric"
            run_success_rate:
              $ref: "#/components/schemas/DashboardComparisonMetric"
            job_success_rate:
              $ref: "#/components/schemas/DashboardComparisonMetric"
            retry_rate:
              $ref: "#/components/schemas/DashboardComparisonMetric"
            run_p95_ms:
              $ref: "#/components/schemas/DashboardComparisonMetric"
            job_p95_ms:
              $ref: "#/components/schemas/DashboardComparisonMetric"
            total_tokens:
              $ref: "#/components/schemas/DashboardComparisonMetric"
          required: [runs_observed, run_success_rate, job_success_rate, retry_rate, run_p95_ms, job_p95_ms, total_tokens]
      required: [mode, coverage, previous_window, metrics]
    DashboardMoneyTotals:
      type: object
      additionalProperties:
        type: string
        pattern: '^\d+(?:\.\d+)?$'
    DashboardCostAttributionGroup:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        run_count: { type: integer, minimum: 0 }
        model_jobs: { type: integer, minimum: 0 }
        usage_records: { type: integer, minimum: 0 }
        costed_jobs: { type: integer, minimum: 0 }
        unavailable_jobs: { type: integer, minimum: 0 }
        failed_jobs: { type: integer, minimum: 0 }
        retry_attempts: { type: integer, minimum: 0 }
        total_tokens:
          type: [integer, "null"]
          minimum: 0
        cost_source:
          type: string
          enum: [provider_reported, estimated, mixed, unavailable]
        cost_completeness:
          type: string
          enum: [complete, partial, unavailable]
        effective_costs:
          $ref: "#/components/schemas/DashboardMoneyTotals"
        provider_reported_costs:
          $ref: "#/components/schemas/DashboardMoneyTotals"
        estimated_costs:
          $ref: "#/components/schemas/DashboardMoneyTotals"
      required: [key, label, run_count, model_jobs, usage_records, costed_jobs, unavailable_jobs, failed_jobs, retry_attempts, total_tokens, cost_source, cost_completeness, effective_costs, provider_reported_costs, estimated_costs]
    DashboardCostReport:
      type: object
      properties:
        basis:
          type: string
          const: provider_reported_preferred
        coverage:
          type: object
          properties:
            runs_observed: { type: integer, minimum: 0 }
            model_jobs: { type: integer, minimum: 0 }
            costed_jobs: { type: integer, minimum: 0 }
            provider_reported_jobs: { type: integer, minimum: 0 }
            estimated_only_jobs: { type: integer, minimum: 0 }
            unavailable_jobs: { type: integer, minimum: 0 }
            cost_completeness:
              type: string
              enum: [complete, partial, unavailable]
          required: [runs_observed, model_jobs, costed_jobs, provider_reported_jobs, estimated_only_jobs, unavailable_jobs, cost_completeness]
        totals:
          type: object
          properties:
            effective_costs:
              $ref: "#/components/schemas/DashboardMoneyTotals"
            provider_reported_costs:
              $ref: "#/components/schemas/DashboardMoneyTotals"
            estimated_costs:
              $ref: "#/components/schemas/DashboardMoneyTotals"
          required: [effective_costs, provider_reported_costs, estimated_costs]
        by_agent:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCostAttributionGroup"
        by_provider_model:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCostAttributionGroup"
        by_work_package:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCostAttributionGroup"
      required: [basis, coverage, totals, by_agent, by_provider_model, by_work_package]
    DashboardSummaryResponse:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        runtime_health:
          type: object
          additionalProperties: true
        workload:
          type: object
          additionalProperties: true
        backlog:
          type: object
          additionalProperties: true
        hotspots:
          type: object
          additionalProperties: true
        observability:
          type: object
          properties:
            query:
              $ref: "#/components/schemas/DashboardObservabilityQuery"
            retention:
              $ref: "#/components/schemas/DashboardObservabilityRetention"
            window:
              type: object
              additionalProperties: true
            reliability:
              type: object
              additionalProperties: true
            latency:
              type: object
              additionalProperties: true
            usage:
              type: object
              additionalProperties: true
            cost_report:
              $ref: "#/components/schemas/DashboardCostReport"
            activity:
              type: array
              items:
                type: object
                additionalProperties: true
            comparison:
              $ref: "#/components/schemas/DashboardObservabilityComparison"
            correlations:
              type: array
              items:
                type: object
                additionalProperties: true
          required: [query, retention, window, reliability, latency, usage, cost_report, activity, comparison, correlations]
      required: [generated_at, runtime_health, workload, backlog, hotspots, observability]
    PlannerValidationResult:
      type: object
      properties:
        passed:
          type: boolean
        warnings:
          type: array
          items:
            type: string
          description: >
            Validation warnings. Includes required-input/DAG checks plus
            registry readiness checks for unknown or disabled agent profiles,
            unknown or disabled skills, profile-disallowed skills, and missing
            OpenClaw agent bindings.
        details:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - missing_required_input
                  - missing_agent_profile
                  - missing_openclaw_agent
                  - unknown_agent_profile
                  - disabled_agent_profile
                  - unknown_skill
                  - disabled_skill
                  - disallowed_skill
                  - no_ready_frontier
                  - no_terminal_node
              category:
                type: string
                enum: [required_input, registry, graph, other]
              message:
                type: string
              field:
                type: string
                nullable: true
              node_id:
                type: string
                nullable: true
              node_name:
                type: string
                nullable: true
              agent_profile_id:
                type: string
                nullable: true
              skill_id:
                type: string
                nullable: true
            required:
              - code
              - category
              - message
              - field
              - node_id
              - node_name
              - agent_profile_id
              - skill_id
      required: [passed, warnings, details]
    RunValidationFailure:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            validation:
              $ref: "#/components/schemas/PlannerValidationResult"
          required: [validation]
    TemplateSummary:
      type: object
      properties:
        template_id:
          type: string
        version:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
      required: [template_id, version, name, status]
    CreateTemplateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
        policy:
          type: object
        nodes:
          type: array
          items:
            type: object
        edges:
          type: array
          items:
            type: object
      required: [name, description, input_schema, policy, nodes, edges]
    PublishTemplateResponse:
      type: object
      properties:
        template_id:
          type: string
        version:
          type: integer
        status:
          type: string
      required: [template_id, version, status]
    DeriveTemplateRequest:
      type: object
      properties:
        template_id:
          type: string
        name:
          type: string
        description:
          type: string
        metadata:
          type: object
    TemplateLineageResponse:
      type: object
      properties:
        family_id:
          type: string
        root_template_id:
          type: string
        items:
          type: array
          items:
            type: object
      required: [family_id, root_template_id, items]
    AgentProfile:
      type: object
      properties:
        profile_id:
          type: string
        name:
          type: string
        openclaw_agent_id:
          type: string
        default_skills:
          type: array
          items:
            type: string
        allowed_tools:
          type: array
          items:
            type: string
        disallowed_skills:
          type: array
          items:
            type: string
        policy_tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        metadata:
          type: object
      required: [profile_id, name, openclaw_agent_id, default_skills, allowed_tools, status]
    AgentHostingSummary:
      type: object
      properties:
        ownership:
          type: object
          properties:
            execution_runtime:
              type: string
              enum: [openclaw]
            orchestration_binding:
              type: string
              enum: [my_mate]
          required: [execution_runtime, orchestration_binding]
        profiles:
          type: array
          items:
            type: object
            properties:
              profile_id:
                type: string
              name:
                type: string
              status:
                type: string
                enum: [active, disabled]
              openclaw_agent_id:
                type: string
              default_skills:
                type: array
                items:
                  type: string
              provider:
                type: string
                nullable: true
              model:
                type: string
                nullable: true
              runtime_mode:
                type: string
                nullable: true
              managed_by:
                type: string
                enum: [my_mate_registry]
              health:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready, needs_binding, disabled]
                  detail:
                    type: string
                required: [status, detail]
            required:
              - profile_id
              - name
              - status
              - openclaw_agent_id
              - default_skills
              - managed_by
              - health
      required: [ownership, profiles]
    UpdateAgentHostingRequest:
      type: object
      properties:
        openclaw_agent_id:
          type: string
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        runtime_mode:
          type: string
          nullable: true
    Skill:
      type: object
      properties:
        skill_id:
          type: string
        name:
          type: string
        category:
          type: string
        allowed_tools:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
      required: [skill_id, name, category, allowed_tools, status]
    CreateRunRequest:
      type: object
      properties:
        intent:
          type: string
        template_id:
          type: string
        inputs:
          type: object
        validation_mode:
          type: string
          enum: [warn, strict, bypass]
          default: strict
          description: >
            warn runs validation and returns warnings without blocking. strict
            blocks run creation when validation fails. bypass skips the gate.
        proposal_id:
          type: string
          description: Optional durable DAG proposal id that sourced the run for lineage.
      required: [intent, template_id, inputs]
    CreateRunResponse:
      type: object
      properties:
        run_id:
          type: string
        status:
          type: string
        validation:
          $ref: "#/components/schemas/PlannerValidationResult"
        route:
          $ref: "#/components/schemas/RunRoute"
      required: [run_id, status, route, validation]
    RunRoute:
      type: object
      properties:
        schema_version:
          type: integer
          const: 1
        run_id:
          type: string
        route_id:
          type: string
        source_kind:
          type: string
          enum: [session_plan, proposal, direct_template, rerun, legacy]
        session_id:
          type: [string, "null"]
        proposal_id:
          type: [string, "null"]
        plan_revision:
          type: [integer, "null"]
        plan_option:
          type: [string, "null"]
          enum: [primary, alternative, null]
        source_run_id:
          type: [string, "null"]
        template_id:
          type: string
        template_version:
          type: integer
        template_name:
          type: string
        node_count:
          type: integer
        edge_count:
          type: integer
        work_packages:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              order:
                type: integer
              node_run_ids:
                type: array
                items:
                  type: string
              identity_source:
                type: string
                enum: [declared, compiler_default, legacy_inferred]
            required: [key, label, order, node_run_ids, identity_source]
        created_at:
          type: string
          format: date-time
      required:
        - schema_version
        - run_id
        - route_id
        - source_kind
        - session_id
        - proposal_id
        - plan_revision
        - plan_option
        - source_run_id
        - template_id
        - template_version
        - template_name
        - node_count
        - edge_count
        - work_packages
        - created_at
    DoctorRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [quick, docker, model]
          default: quick
        runtime:
          type: string
