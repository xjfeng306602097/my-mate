openapi: 3.1.0
info:
  title: My Mate Control Plane API
  version: 0.1.0
  description: >
    Draft API contract for the My Mate workflow control plane.

servers:
  - url: https://api.my-mate.local

tags:
  - name: Templates
  - name: Runs
  - name: Mobile
  - name: Approvals
  - name: RuntimeWorkspaceChanges
  - name: HumanInputs
  - name: Planner
  - name: Agents
  - name: Sessions
  - name: Diagnostics
  - name: Evaluation
  - name: Observability
  - name: Identity
  - name: Workspaces
  - name: Governance
  - name: Memory
  - name: InternalOps

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
    SessionGeneratedArtifact:
      type: object
      properties:
        artifact_id: { type: string }
        session_id: { type: string }
        name: { type: string }
        storage_uri: { type: string }
        mime_type: { type: [string, "null"] }
        size_bytes: { type: [integer, "null"], minimum: 0 }
        summary: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        source_attachment_id: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
      required: [artifact_id, session_id, name, storage_uri, mime_type, size_bytes, summary, created_at, source_attachment_id, version]
    SessionGeneratedArtifactDiffLine:
      type: object
      properties:
        type: { type: string, enum: [context, added, removed] }
        text: { type: string }
        old_line: { type: [integer, "null"], minimum: 1 }
        new_line: { type: [integer, "null"], minimum: 1 }
      required: [type, text, old_line, new_line]
    SessionGeneratedArtifactComparison:
      type: object
      properties:
        base: { $ref: "#/components/schemas/SessionGeneratedArtifact" }
        target: { $ref: "#/components/schemas/SessionGeneratedArtifact" }
        additions: { type: integer, minimum: 0 }
        deletions: { type: integer, minimum: 0 }
        changed: { type: boolean }
        lines:
          type: array
          items: { $ref: "#/components/schemas/SessionGeneratedArtifactDiffLine" }
      required: [base, target, additions, deletions, changed, lines]
    MissionMaterializerStatus:
      type: object
      properties:
        session_id: { type: string }
        materializer_version: { type: integer, const: 1 }
        last_sequence: { type: integer, minimum: 1 }
        event_count: { type: integer, minimum: 1 }
        checkpoint_sequence: { type: [integer, "null"], minimum: 1 }
        source_digest: { type: string }
        projection_digest: { type: string }
        materialized_at: { type: string, format: date-time }
      required: [session_id, materializer_version, last_sequence, event_count, checkpoint_sequence, source_digest, projection_digest, materialized_at]
    MissionMaterializerRebuildResponse:
      allOf:
        - $ref: "#/components/schemas/MissionMaterializerStatus"
        - type: object
          properties:
            rebuilt: { type: boolean, const: true }
          required: [rebuilt]
    MissionMaterializerConsistencyReport:
      type: object
      properties:
        session_id: { type: string }
        status:
          type: string
          enum: [consistent, drifted]
        source_digest: { type: string }
        direct_projection_digest: { type: string }
        materialized_projection_digest: { type: string }
        last_sequence: { type: integer, minimum: 1 }
        event_count: { type: integer, minimum: 1 }
        checkpoint_sequence: { type: [integer, "null"], minimum: 1 }
        differing_sections:
          type: array
          items:
            type: string
            enum: [missionSpec, missionSpecContract, missionSnapshot]
        verified_at: { type: string, format: date-time }
      required: [session_id, status, source_digest, direct_projection_digest, materialized_projection_digest, last_sequence, event_count, checkpoint_sequence, differing_sections, verified_at]
    WorkspaceRole:
      type: string
      enum: [owner, admin, operator, viewer]
    WorkspacePermission:
      type: string
      enum: [workspace.read, workspace.manage_members, registry.manage, governance.review, mission.create, mission.edit, run.create, run.control, run.evaluate, gate.resolve, memory.read, memory.propose, memory.write, memory.review, memory.manage, audit.read]
    MemoryScopeKind:
      type: string
      enum: [user, workspace, project, agent]
    MemoryKind:
      type: string
      enum: [preference, fact, convention, decision, lesson]
    MemorySensitivity:
      type: string
      enum: [normal, private, restricted]
    MemoryStatus:
      type: string
      enum: [active, superseded, expired, deleted]
    MemorySourceOrigin:
      type: string
      enum: [explicit_user, inferred, background_review, imported, system]
    MemorySource:
      type: object
      properties:
        origin:
          $ref: "#/components/schemas/MemorySourceOrigin"
        session_id: { type: [string, "null"] }
        message_ids:
          type: array
          items: { type: string }
        action_id: { type: [string, "null"] }
        provider_id: { type: [string, "null"] }
        note: { type: [string, "null"] }
      required: [origin, session_id, message_ids, action_id, provider_id, note]
    MemoryProposal:
      type: object
      properties:
        scope_kind:
          $ref: "#/components/schemas/MemoryScopeKind"
        scope_id: { type: string }
        kind:
          $ref: "#/components/schemas/MemoryKind"
        content: { type: string, minLength: 1, maxLength: 4000 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        importance: { type: number, minimum: 0, maximum: 1 }
        sensitivity:
          $ref: "#/components/schemas/MemorySensitivity"
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
        source:
          $ref: "#/components/schemas/MemorySource"
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        supersedes_memory_id: { type: [string, "null"] }
      required: [scope_kind, scope_id, kind, content, confidence, importance, sensitivity, tags, source, valid_from, valid_until, expires_at, supersedes_memory_id]
    MemoryRecord:
      allOf:
        - $ref: "#/components/schemas/MemoryProposal"
        - type: object
          properties:
            schema_version: { type: integer, const: 1 }
            memory_id: { type: string }
            workspace_id: { type: string }
            status:
              $ref: "#/components/schemas/MemoryStatus"
            version: { type: integer, minimum: 1 }
            created_by: { type: string }
            created_at: { type: string, format: date-time }
            updated_by: { type: string }
            updated_at: { type: string, format: date-time }
          required: [schema_version, memory_id, workspace_id, status, version, created_by, created_at, updated_by, updated_at]
    MemoryWriteFields:
      type: object
      properties:
        scope_kind:
          $ref: "#/components/schemas/MemoryScopeKind"
        scope_id: { type: string }
        kind:
          $ref: "#/components/schemas/MemoryKind"
        content: { type: string, minLength: 1, maxLength: 4000 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        importance: { type: number, minimum: 0, maximum: 1 }
        sensitivity:
          $ref: "#/components/schemas/MemorySensitivity"
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
        source:
          type: object
          additionalProperties: true
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        supersedes_memory_id: { type: [string, "null"] }
      additionalProperties: false
    CreateMemoryRequest:
      allOf:
        - $ref: "#/components/schemas/MemoryWriteFields"
        - type: object
          required: [content]
    UpdateMemoryRequest:
      $ref: "#/components/schemas/MemoryWriteFields"
      minProperties: 1
    MemoryCandidateStatus:
      type: string
      enum: [pending, approved, rejected]
    MemoryCandidateRisk:
      type: string
      enum: [low, medium, high]
    MemoryCandidateOperation:
      type: string
      enum: [create, update, delete]
    MemoryCandidateRecord:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        candidate_id: { type: string }
        workspace_id: { type: string }
        operation:
          $ref: "#/components/schemas/MemoryCandidateOperation"
        target_memory_id: { type: [string, "null"] }
        proposed_memory:
          oneOf:
            - $ref: "#/components/schemas/MemoryProposal"
            - type: "null"
        source:
          $ref: "#/components/schemas/MemorySource"
        rationale: { type: string }
        risk:
          $ref: "#/components/schemas/MemoryCandidateRisk"
        autonomy_mode:
          type: string
          enum: [review_first, assisted, autopilot]
        status:
          $ref: "#/components/schemas/MemoryCandidateStatus"
        proposed_by: { type: string }
        proposed_at: { type: string, format: date-time }
        resolved_by: { type: [string, "null"] }
        resolved_at: { type: [string, "null"], format: date-time }
        resolution_note: { type: [string, "null"] }
        committed_memory_id: { type: [string, "null"] }
      required: [schema_version, candidate_id, workspace_id, operation, target_memory_id, proposed_memory, source, rationale, risk, autonomy_mode, status, proposed_by, proposed_at, resolved_by, resolved_at, resolution_note, committed_memory_id]
    CreateMemoryCandidateRequest:
      type: object
      properties:
        proposed_memory:
          $ref: "#/components/schemas/CreateMemoryRequest"
        rationale: { type: string, maxLength: 1000 }
        risk:
          $ref: "#/components/schemas/MemoryCandidateRisk"
        autonomy_mode:
          type: string
          enum: [review_first, assisted, autopilot]
      required: [proposed_memory]
      additionalProperties: false
    ResolveMemoryCandidateRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
      additionalProperties: false
    CoreMemorySnapshotEntry:
      type: object
      properties:
        memory_id: { type: string }
        memory_version: { type: integer, minimum: 1 }
        scope_kind: { $ref: "#/components/schemas/MemoryScopeKind" }
        scope_id: { type: string }
        kind: { $ref: "#/components/schemas/MemoryKind" }
        content: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        importance: { type: number, minimum: 0, maximum: 1 }
        sensitivity: { type: string, enum: [normal, private] }
        tags:
          type: array
          items: { type: string }
        source: { $ref: "#/components/schemas/MemorySource" }
        updated_at: { type: string, format: date-time }
      required: [memory_id, memory_version, scope_kind, scope_id, kind, content, confidence, importance, sensitivity, tags, source, updated_at]
    CoreMemorySnapshot:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        snapshot_id: { type: string }
        session_id: { type: string }
        workspace_id: { type: string }
        owner_principal_id: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/CoreMemorySnapshotEntry" }
        memory_versions:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
        character_budget: { type: integer, minimum: 1 }
        estimated_token_budget: { type: integer, minimum: 1 }
        digest: { type: string }
        created_at: { type: string, format: date-time }
        project_binding:
          oneOf:
            - type: object
              properties:
                project_id: { type: string }
                bound_at: { type: string, format: date-time }
              required: [project_id, bound_at]
            - type: "null"
        project_entries:
          type: array
          items: { $ref: "#/components/schemas/CoreMemorySnapshotEntry" }
      required: [schema_version, snapshot_id, session_id, workspace_id, owner_principal_id, entries, memory_versions, character_budget, estimated_token_budget, digest, created_at, project_binding, project_entries]
    MemorySettings:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        workspace_id: { type: string }
        background_review:
          type: object
          properties:
            enabled: { type: boolean }
            min_user_characters: { type: integer, minimum: 1, maximum: 10000 }
            max_candidates_per_review: { type: integer, minimum: 1, maximum: 20 }
          required: [enabled, min_user_characters, max_candidates_per_review]
        automatic_recall:
          type: object
          properties:
            enabled: { type: boolean }
            max_results: { type: integer, minimum: 1, maximum: 20 }
            character_budget: { type: integer, minimum: 500, maximum: 20000 }
            cache_ttl_seconds: { type: integer, minimum: 0, maximum: 3600 }
          required: [enabled, max_results, character_budget, cache_ttl_seconds]
        intelligence:
          type: object
          properties:
            extraction_mode: { type: string, enum: [deterministic, hybrid] }
            intent_model_enabled: { type: boolean }
            provider_connection_id: { type: [string, "null"] }
            model: { type: [string, "null"] }
            max_turn_characters: { type: integer, minimum: 1000, maximum: 100000 }
            min_confidence: { type: number, minimum: 0.5, maximum: 1 }
            model_timeout_ms: { type: integer, minimum: 1000, maximum: 180000 }
          required: [extraction_mode, intent_model_enabled, provider_connection_id, model, max_turn_characters, min_confidence, model_timeout_ms]
        scope_policy:
          type: object
          properties:
            project_memory_enabled: { type: boolean }
            agent_memory_enabled: { type: boolean }
          required: [project_memory_enabled, agent_memory_enabled]
        retention:
          type: object
          properties:
            resolved_candidate_days: { type: integer, minimum: 1, maximum: 3650 }
            journal_max_records: { type: integer, minimum: 100, maximum: 1000000 }
            maintenance_interval_minutes: { type: integer, minimum: 1, maximum: 10080 }
            soft_deleted_memory_days: { type: integer, minimum: 1, maximum: 3650 }
            expired_memory_days: { type: integer, minimum: 1, maximum: 3650 }
            turn_context_days: { type: integer, minimum: 1, maximum: 3650 }
            feedback_days: { type: integer, minimum: 1, maximum: 3650 }
            backup_days: { type: integer, minimum: 1, maximum: 3650 }
          required: [resolved_candidate_days, journal_max_records, maintenance_interval_minutes, soft_deleted_memory_days, expired_memory_days, turn_context_days, feedback_days, backup_days]
        embedding:
          type: object
          properties:
            provider: { type: string, enum: [disabled, openai-compatible] }
            provider_connection_id: { type: [string, "null"] }
            model: { type: [string, "null"] }
            dimensions: { type: [integer, "null"], minimum: 1 }
          required: [provider, provider_connection_id, model, dimensions]
        knowledge_graph:
          type: object
          properties:
            provider: { type: string, enum: [disabled, mempalace] }
            palace_path: { type: [string, "null"] }
            python_bin: { type: [string, "null"] }
            sync_canonical: { type: boolean }
          required: [provider, palace_path, python_bin, sync_canonical]
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
      required: [schema_version, workspace_id, background_review, automatic_recall, intelligence, scope_policy, retention, embedding, knowledge_graph, updated_by, updated_at]
    MemoryObservability:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        workspace_id: { type: string }
        retrieval_queries: { type: integer, minimum: 0 }
        retrieval_failures: { type: integer, minimum: 0 }
        retrieval_total_latency_ms: { type: integer, minimum: 0 }
        retrieval_last_latency_ms: { type: [integer, "null"], minimum: 0 }
        lexical_hits: { type: integer, minimum: 0 }
        ngram_hits: { type: integer, minimum: 0 }
        embedding_hits: { type: integer, minimum: 0 }
        embedding_fallbacks: { type: integer, minimum: 0 }
        index_rebuilds: { type: integer, minimum: 0 }
        background_reviews: { type: integer, minimum: 0 }
        background_candidates: { type: integer, minimum: 0 }
        background_commits: { type: integer, minimum: 0 }
        model_extraction_attempts: { type: integer, minimum: 0 }
        model_extraction_successes: { type: integer, minimum: 0 }
        model_extraction_fallbacks: { type: integer, minimum: 0 }
        model_proposed_creates: { type: integer, minimum: 0 }
        model_proposed_updates: { type: integer, minimum: 0 }
        model_proposed_supersedes: { type: integer, minimum: 0 }
        model_proposed_deletes: { type: integer, minimum: 0 }
        automatic_recall_queries: { type: integer, minimum: 0 }
        automatic_recall_hits: { type: integer, minimum: 0 }
        automatic_recall_failures: { type: integer, minimum: 0 }
        automatic_recall_cache_hits: { type: integer, minimum: 0 }
        automatic_recall_cache_misses: { type: integer, minimum: 0 }
        automatic_recall_total_latency_ms: { type: integer, minimum: 0 }
        automatic_recall_last_latency_ms: { type: [integer, "null"], minimum: 0 }
        intent_model_attempts: { type: integer, minimum: 0 }
        intent_model_successes: { type: integer, minimum: 0 }
        intent_model_fallbacks: { type: integer, minimum: 0 }
        candidates_approved: { type: integer, minimum: 0 }
        candidates_rejected: { type: integer, minimum: 0 }
        imported_memories: { type: integer, minimum: 0 }
        exported_memories: { type: integer, minimum: 0 }
        maintenance_runs: { type: integer, minimum: 0 }
        maintenance_sweeps: { type: integer, minimum: 0 }
        maintenance_workspace_failures: { type: integer, minimum: 0 }
        private_memory_migrations: { type: integer, minimum: 0 }
        private_candidate_migrations: { type: integer, minimum: 0 }
        last_query_at: { type: [string, "null"], format: date-time }
        last_review_at: { type: [string, "null"], format: date-time }
        last_maintenance_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
      required: [schema_version, workspace_id, retrieval_queries, retrieval_failures, retrieval_total_latency_ms, retrieval_last_latency_ms, lexical_hits, ngram_hits, embedding_hits, embedding_fallbacks, index_rebuilds, background_reviews, background_candidates, background_commits, model_extraction_attempts, model_extraction_successes, model_extraction_fallbacks, model_proposed_creates, model_proposed_updates, model_proposed_supersedes, model_proposed_deletes, automatic_recall_queries, automatic_recall_hits, automatic_recall_failures, automatic_recall_cache_hits, automatic_recall_cache_misses, automatic_recall_total_latency_ms, automatic_recall_last_latency_ms, intent_model_attempts, intent_model_successes, intent_model_fallbacks, candidates_approved, candidates_rejected, imported_memories, exported_memories, maintenance_runs, maintenance_sweeps, maintenance_workspace_failures, private_memory_migrations, private_candidate_migrations, last_query_at, last_review_at, last_maintenance_at, updated_at]
    MemoryReviewRecord:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        workspace_id: { type: string }
        session_id: { type: string }
        message_digest: { type: string }
        status: { type: string, enum: [completed, skipped, failed] }
        reviewed_message_ids: { type: array, items: { type: string } }
        candidate_ids: { type: array, items: { type: string } }
        committed_memory_ids: { type: array, items: { type: string } }
        extractor: { type: string, enum: [deterministic, model] }
        provider_connection_id: { type: [string, "null"] }
        proposed_operations:
          type: object
          properties:
            create: { type: integer, minimum: 0 }
            update: { type: integer, minimum: 0 }
            supersede: { type: integer, minimum: 0 }
            delete: { type: integer, minimum: 0 }
          required: [create, update, supersede, delete]
        reason: { type: [string, "null"] }
        reviewed_at: { type: string, format: date-time }
      required: [schema_version, workspace_id, session_id, message_digest, status, reviewed_message_ids, candidate_ids, committed_memory_ids, extractor, provider_connection_id, proposed_operations, reason, reviewed_at]
    ConversationIntentEvaluationResult:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        suite: { type: string }
        total: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        accuracy: { type: number, minimum: 0, maximum: 1 }
        average_confidence: { type: number, minimum: 0, maximum: 1 }
        per_intent:
          type: array
          items:
            type: object
            properties:
              intent: { type: string, enum: [capture_goal, clarify, ask_status, add_constraint, ask_draft, ask_plan, ask_revise, ask_confirm, ask_run] }
              total: { type: integer, minimum: 0 }
              passed: { type: integer, minimum: 0 }
              accuracy: { type: number, minimum: 0, maximum: 1 }
            required: [intent, total, passed, accuracy]
        cases:
          type: array
          items:
            type: object
            properties:
              fixture_id: { type: string }
              expected_intent: { type: string, enum: [capture_goal, clarify, ask_status, add_constraint, ask_draft, ask_plan, ask_revise, ask_confirm, ask_run] }
              actual_intent: { type: string, enum: [capture_goal, clarify, ask_status, add_constraint, ask_draft, ask_plan, ask_revise, ask_confirm, ask_run] }
              confidence: { type: number, minimum: 0, maximum: 1 }
              passed: { type: boolean }
            required: [fixture_id, expected_intent, actual_intent, confidence, passed]
        memory_operations:
          type: object
          properties:
            total: { type: integer, minimum: 0 }
            passed: { type: integer, minimum: 0 }
            accuracy: { type: number, minimum: 0, maximum: 1 }
            per_operation:
              type: array
              items:
                type: object
                properties:
                  operation: { type: string, enum: [create, update, supersede, delete, ignore] }
                  total: { type: integer, minimum: 0 }
                  passed: { type: integer, minimum: 0 }
                  accuracy: { type: number, minimum: 0, maximum: 1 }
                required: [operation, total, passed, accuracy]
            cases:
              type: array
              items:
                type: object
                properties:
                  fixture_id: { type: string }
                  expected_operation: { type: string, enum: [create, update, supersede, delete, ignore] }
                  actual_operation: { type: string, enum: [create, update, supersede, delete, ignore] }
                  passed: { type: boolean }
                required: [fixture_id, expected_operation, actual_operation, passed]
          required: [total, passed, accuracy, per_operation, cases]
        evaluated_at: { type: string, format: date-time }
      required: [schema_version, suite, total, passed, accuracy, average_confidence, per_intent, cases, memory_operations, evaluated_at]
    MemoryMaintenanceResult:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        workspace_id: { type: string }
        expired_memories: { type: integer, minimum: 0 }
        pruned_candidates: { type: integer, minimum: 0 }
        retrieval_rebuilt: { type: boolean }
        canonical_memories: { type: integer, minimum: 0 }
        private_memories_migrated: { type: integer, minimum: 0 }
        private_candidates_migrated: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        completed_at: { type: string, format: date-time }
      required: [schema_version, workspace_id, expired_memories, pruned_candidates, retrieval_rebuilt, canonical_memories, private_memories_migrated, private_candidates_migrated, duration_ms, completed_at]
    MemoryMaintenanceSweepResult:
      type: object
      properties:
        schema_version: { type: integer, const: 1 }
        workspace_count: { type: integer, minimum: 0 }
        maintained_workspaces: { type: integer, minimum: 0 }
        skipped_workspaces: { type: integer, minimum: 0 }
        failed_workspaces:
          type: array
          items:
            type: object
            properties:
              workspace_id: { type: string }
              error: { type: string }
            required: [workspace_id, error]
        results:
          type: array
          items: { $ref: "#/components/schemas/MemoryMaintenanceResult" }
        completed_at: { type: string, format: date-time }
      required: [schema_version, workspace_count, maintained_workspaces, skipped_workspaces, failed_workspaces, results, completed_at]
    MemoryImportRequest:
      type: object
      properties:
        payload: {}
        memories: { type: array, items: { type: object, additionalProperties: true } }
        dry_run: { type: boolean, default: false }
        strategy: { type: string, enum: [skip, merge, replace], default: skip }
      additionalProperties: true
    MemoryImportResult:
      type: object
      properties:
        dry_run: { type: boolean }
        strategy: { type: string, enum: [skip, merge, replace] }
        total: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer, minimum: 0 }
