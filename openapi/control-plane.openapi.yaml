      responses:
        "201":
          description: Recorded feedback and optional overlay
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback: { $ref: "#/components/schemas/MemoryRecommendationFeedback" }
                  overlay:
                    oneOf:
                      - { $ref: "#/components/schemas/MemoryOverlay" }
                      - { type: "null" }
                required: [feedback, overlay]

