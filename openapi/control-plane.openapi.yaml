      summary: Query the indexed runtime dashboard summary
      parameters:
        - in: query
          name: window_hours
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 720
          description: Optional 1-720 hour runtime overlap window. Omit to preserve legacy all-run reliability aggregation.
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, active, terminal, completed, failed, cancelled]
            default: all
        - in: query
          name: correlation_limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: compare
          required: false
          schema:
            type: string
            enum: [none, previous]
            default: none
          description: Compare the selected window with the immediately preceding equal-length period. Requires window_hours when set to previous.
      responses:
        "200":
          description: Indexed dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "400":
