        block_id: { type: string }
        component: { type: string, enum: [task_guidance, decision_queue, progress_summary, result_gallery, quality_summary, repair_recommendation, conversation, technical_details] }
        priority: { type: integer }
        visibility: { type: string, enum: [primary, secondary, advanced] }
        title: { type: string }
        data: { type: object }
      required: [block_id, component, priority, visibility, title, data]
    MissionUiPlan:
      type: object
      properties:
        version: { type: integer, const: 1 }
        phase: { type: string }
        generated_at: { type: string, format: date-time }
        primary_action: { type: [string, "null"] }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/MissionUiBlock" }
        fallback_component: { type: string, const: task_guidance }
      required: [version, phase, generated_at, primary_action, blocks, fallback_component]

security:
  - bearerAuth: []

paths:
  /api/supervision/alerts:
    get:
      operationId: listSupervisionAlerts
      tags: [Supervision]
      parameters:
        - in: query
          name: session_id
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [open, resolved] }
      responses:
        "200":
          description: Persistent proactive supervision alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SupervisionAlert" }
                required: [items]
  /api/supervision/scan:
    post:
      operationId: scanProactiveSupervision
      tags: [Supervision]
      responses:
        "200":
          description: Supervision scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisionScanResult" }
  /api/supervision/alerts/{alertId}/resolve:
    post:
      operationId: resolveSupervisionAlert
      tags: [Supervision]
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisionAlert" }
        "404":
          description: Alert not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/sessions/{sessionId}/artifacts/{artifactId}:
    get:
      operationId: getSessionGeneratedArtifact
      tags: [Sessions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Generated artifact metadata, preview content, and version lineage
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact: { $ref: "#/components/schemas/SessionGeneratedArtifact" }
                  content: { type: string }
                  preview_kind: { type: string, enum: [markdown, text] }
                  previous_artifact_id: { type: [string, "null"] }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionGeneratedArtifact" }
                required: [artifact, content, preview_kind, previous_artifact_id, versions]
        "404":
          description: Generated artifact or Session not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/sessions/{sessionId}/artifacts/{artifactId}/compare:
    get:
      operationId: compareSessionGeneratedArtifact
      tags: [Sessions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
        - in: query
          name: base_artifact_id
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Line-level comparison between two versions of a generated artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionGeneratedArtifactComparison" }
        "404":
          description: Generated artifact, Session, or previous version not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/sessions/{sessionId}/artifacts/{artifactId}/download:
    get:
      operationId: downloadSessionGeneratedArtifact
      tags: [Sessions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: UTF-8 content of a generated Session artifact
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
            text/markdown:
              schema: { type: string }
        "404":
          description: Generated artifact or Session not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/sessions/{sessionId}/workspace-binding:
    get:
      operationId: getSessionWorkspaceBinding
      tags: [Sessions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public state of the active Desktop Workspace Binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBindingResponse" }
  /api/sessions/{sessionId}/task-workspace:
    get:
      operationId: getSessionTaskWorkspace
      tags: [Sessions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Durable Project and output-directory binding for the Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskWorkspaceResponse" }
  /api/projects:
    get:
      operationId: listLocalProjects
      tags: [Sessions]
      parameters:
        - in: query
          name: visibility
          required: false
          schema: { type: string, enum: [active, all] }
      responses:
        "200":
          description: Local Projects registered by an authenticated Desktop Host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProjectListResponse" }
  /api/sessions/{sessionId}/autopilot:
    get:
      operationId: getSessionAutopilot
      tags: [Autopilot]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Durable Session Autopilot controller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotController" }
    put:
      operationId: updateSessionAutopilot
      tags: [Autopilot]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAutopilotRequest" }
      responses:
        "200":
          description: Updated Session Autopilot controller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotController" }
  /api/sessions/{sessionId}/autopilot/tick:
    post:
      operationId: tickSessionAutopilot
      tags: [Autopilot]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Advanced Session Autopilot controller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotController" }
  /api/sessions/{sessionId}/autopilot/pause:
    post:
      operationId: pauseSessionAutopilot
      tags: [Autopilot]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Paused Session Autopilot controller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotController" }
  /api/sessions/{sessionId}/autopilot/resume:
    post:
      operationId: resumeSessionAutopilot
      tags: [Autopilot]
      parameters:
