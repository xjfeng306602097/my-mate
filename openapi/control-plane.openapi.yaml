        current_summary:
          type: string
        updated_at:
          type: string
          format: date-time
        active_task:
          anyOf:
            - $ref: "#/components/schemas/MobileTask"
            - type: "null"
        pending_approval_count:
          type: integer
        pending_human_input_count:
          type: integer
        artifact_count:
          type: integer
        next_actions:
          type: array
          items:
            type: string
      required:
        - run_id
        - template_id
        - template_version
        - status
        - intent
        - current_summary
        - updated_at
        - active_task
        - pending_approval_count
        - pending_human_input_count
        - artifact_count
        - next_actions
    MobileInboxItem:
      type: object
      properties:
        kind:
          type: string
          enum: [approval, human_input]
        request_id:
          type: string
        run_id:
          type: string
        node_run_id:
          type: [string, "null"]
        run_status:
          type: string
        intent:
          type: string
        summary:
          type: string
        requested_at:
          type: string
          format: date-time
        task:
          anyOf:
            - $ref: "#/components/schemas/MobileTask"
            - type: "null"
        next_actions:
          type: array
          items:
            type: string
      required:
        - kind
        - request_id
        - run_id
        - node_run_id
        - run_status
        - intent
        - summary
        - requested_at
        - task
        - next_actions
    MobileHomeResponse:
      type: object
      properties:
        overview:
          type: object
        focus_run:
          anyOf:
            - $ref: "#/components/schemas/MobileRunSummary"
            - type: "null"
        recent_runs:
          type: array
          items:
            $ref: "#/components/schemas/MobileRunSummary"
        inbox:
          type: object
      required: [overview, focus_run, recent_runs, inbox]
    MobileRunDetail:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/RunDetail"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/MobileTask"
        pending_approvals:
          type: array
          items:
            type: object
        pending_human_inputs:
          type: array
          items:
            type: object
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_actions:
          type: array
          items:
            type: string
      required:
        - run
        - tasks
        - pending_approvals
        - pending_human_inputs
        - artifacts
        - timeline
        - next_actions
    MobileRunFollowUp:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/RunDetail"
        blocker:
          type: [string, "null"]
        active_task:
          anyOf:
            - $ref: "#/components/schemas/MobileTask"
            - type: "null"
        pending_approvals:
          type: array
          items:
            type: object
        pending_human_inputs:
          type: array
          items:
            type: object
        latest_timeline:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        artifact_count:
          type: integer
        next_actions:
          type: array
          items:
            type: string
      required:
        - run
        - blocker
        - active_task
        - pending_approvals
        - pending_human_inputs
        - latest_timeline
        - artifacts
        - artifact_count
        - next_actions

security:
  - bearerAuth: []

paths:
  /api/dashboard/summary:
    get:
      tags: [Observability]
      summary: Query the indexed runtime dashboard summary
      parameters:
        - in: query
          name: window_hours
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 720
          description: Optional 1-720 hour runtime overlap window. Omit to preserve legacy all-run reliability aggregation.
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, active, terminal, completed, failed, cancelled]
            default: all
        - in: query
          name: correlation_limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: compare
          required: false
          schema:
            type: string
            enum: [none, previous]
            default: none
          description: Compare the selected window with the immediately preceding equal-length period. Requires window_hours when set to previous.
      responses:
        "200":
          description: Indexed dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "400":
          description: Invalid observability filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/templates:
    get:
      tags: [Templates]
      summary: List templates
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateSummary"
                required: [items]
    post:
      tags: [Templates]
      summary: Create template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSummary"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/templates/{templateId}:
    get:
      tags: [Templates]
      summary: Get template detail
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template detail
          content:
            application/json:
              schema:
                type: object
    put:
      tags: [Templates]
      summary: Update template draft
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object

  /api/templates/{templateId}/publish:
    post:
      tags: [Templates]
      summary: Publish template version
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishTemplateResponse"

  /api/templates/{templateId}/lineage:
    get:
      tags: [Templates]
      summary: Get template lineage
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateLineageResponse"

  /api/templates/{templateId}/derive:
    post:
      tags: [Templates]
      summary: Derive a new draft template from source
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeriveTemplateRequest"
      responses:
        "201":
          description: Draft derived

  /api/templates/{templateId}/new-version:
    post:
      tags: [Templates]
      summary: Create next-version draft from a published template
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeriveTemplateRequest"
      responses:
        "201":
          description: Version draft created

  /api/templates/{templateId}/archive:
    post:
      tags: [Templates]
      summary: Archive template
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishTemplateResponse"

  /api/registry/agent-profiles:
    get:
      tags: [Templates]
      summary: List agent profiles
      responses:
        "200":
          description: Agent profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentProfile"
                required: [items]
    post:
      tags: [Templates]
      summary: Upsert agent profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfile"
      responses:
        "201":
          description: Agent profile upserted

  /api/registry/agent-profiles/{profileId}:
    get:
      tags: [Templates]
      summary: Get agent profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"

  /api/registry/agent-profiles/{profileId}/disable:
    post:
      tags: [Templates]
      summary: Disable agent profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disabled

  /api/agents/hosting:
    get:
      tags: [Agents]
      summary: List OpenClaw agent hosting bindings
      responses:
        "200":
          description: Agent hosting summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHostingSummary"

  /api/agents/{profileId}/hosting:
    put:
      tags: [Agents]
      summary: Update OpenClaw hosting fields for an agent profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentHostingRequest"
      responses:
        "200":
          description: Updated agent hosting binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/AgentProfile"
                  agent_hosting:
                    $ref: "#/components/schemas/AgentHostingSummary"
                required: [profile, agent_hosting]

  /api/registry/skills:
    get:
      tags: [Templates]
      summary: List skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
                required: [items]
    post:
      tags: [Templates]
      summary: Upsert skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Skill"
      responses:
        "201":
          description: Skill upserted

  /api/registry/skills/{skillId}:
    get:
      tags: [Templates]
      summary: Get skill
      parameters:
        - in: path
          name: skillId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /api/registry/skills/{skillId}/disable:
    post:
      tags: [Templates]
      summary: Disable skill
      parameters:
        - in: path
          name: skillId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disabled

  /api/sessions/{sessionId}/dag-proposals:
    post:
      tags: [Sessions]
      summary: Create durable DAG proposal for a session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDagProposalRequest"
      responses:
        "201":
          description: DAG proposal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                  proposal:
                    $ref: "#/components/schemas/DagProposalRecord"
                required: [session, proposal]
        "400":
          description: Proposal generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Sessions]
      summary: List session DAG proposals
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DAG proposal summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DagProposalSummary"
                  confirmed_proposal_id:
                    type:
                      - string
                      - "null"
                required: [items, confirmed_proposal_id]

  /api/sessions/{sessionId}/dag-proposals/{proposalId}:
    get:
      tags: [Sessions]
      summary: Get session DAG proposal
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DAG proposal detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    $ref: "#/components/schemas/DagProposalRecord"
                required: [proposal]

  /api/sessions/{sessionId}/dag-proposals/{proposalId}/assignments:
    patch:
      tags: [Sessions]
      summary: Replace editable DAG proposal assignments
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDagProposalAssignmentsRequest"
      responses:
        "200":
          description: Assignments updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    $ref: "#/components/schemas/DagProposalRecord"
                required: [proposal]

  /api/sessions/{sessionId}/dag-proposals/{proposalId}/confirm:
    post:
      tags: [Sessions]
      summary: Confirm a DAG proposal as the session execution source
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDagProposalRequest"
      responses:
        "200":
          description: Proposal confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                  proposal:
                    $ref: "#/components/schemas/DagProposalRecord"
                  message:
                    type: object
                required: [session, proposal, message]

  /api/sessions/{sessionId}/dag-proposals/{proposalId}/reject:
    post:
      tags: [Sessions]
      summary: Reject a DAG proposal
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDagProposalRequest"
      responses:
        "200":
          description: Proposal rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    $ref: "#/components/schemas/DagProposalRecord"
                required: [proposal]

  /api/sessions/{sessionId}/dag-proposals/{proposalId}/supersede:
    post:
      tags: [Sessions]
      summary: Supersede a DAG proposal with a newer proposal
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupersedeDagProposalRequest"
      responses:
        "201":
          description: Replacement proposal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                  proposal:
                    $ref: "#/components/schemas/DagProposalRecord"
                  superseded_proposal:
                    $ref: "#/components/schemas/DagProposalRecord"
                required: [proposal, superseded_proposal]

  /api/auth/me:
    get:
      operationId: getCurrentIdentity
      tags: [Identity]
      summary: Return the authenticated principal, selected workspace, and permissions
      responses:
        "200":
          description: Trusted request identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: Missing or invalid trusted identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/workspaces:
    get:
      operationId: listWorkspaces
      tags: [Workspaces]
      summary: List workspaces available to the authenticated principal
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceRecord"
                required: [items]
    post:
      operationId: createWorkspace
      tags: [Workspaces]
      summary: Create a workspace and owner membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    $ref: "#/components/schemas/WorkspaceRecord"
                  membership:
                    $ref: "#/components/schemas/WorkspaceMemberRecord"
                required: [workspace, membership]

  /api/workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      tags: [Workspaces]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workspace member list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMemberRecord"
                required: [items]

  /api/workspaces/{workspaceId}/members/{principalId}:
    put:
      operationId: updateWorkspaceMember
      tags: [Workspaces]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
        - in: path
          name: principalId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceMemberRequest"
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberRecord"

  /api/governance/policy:
    get:
      operationId: getGovernancePolicy
      tags: [Governance]
      summary: Return the active workspace governance policy
      responses:
        "200":
          description: Governance policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyRecord"
    post:
      operationId: updateGovernancePolicy
      tags: [Governance]
      summary: Update approval requirements for protected registry changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGovernancePolicyRequest"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyRecord"
        "400":
          description: Invalid policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Governance review permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/governance/changes:
    get:
      operationId: listGovernanceChanges
      tags: [Governance]
      summary: List workspace registry governance changes
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/GovernanceChangeStatus"
        - in: query
          name: action
          schema:
            $ref: "#/components/schemas/GovernanceProtectedAction"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Governance change list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceChangeListResponse"
    post:
      operationId: createGovernanceChange
      tags: [Governance]
      summary: Propose a protected registry or template lifecycle change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGovernanceChangeRequest"
      responses:
        "201":
          description: Pending governance change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceChangeRecord"
        "400":
          description: Invalid proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/governance/changes/{changeId}:
    get:
      operationId: getGovernanceChange
      tags: [Governance]
      summary: Return one workspace governance change
      parameters:
        - in: path
          name: changeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Governance change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceChangeRecord"
        "404":
          description: Change not found in the selected workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/governance/changes/{changeId}/approve:
    post:
      operationId: approveGovernanceChange
      tags: [Governance]
      summary: Approve a pending governance change
      parameters:
        - in: path
          name: changeId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceDecisionRequest"
      responses:
        "200":
          description: Updated governance change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceChangeRecord"
        "409":
          description: Self approval, duplicate decision, or invalid state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/governance/changes/{changeId}/reject:
    post:
      operationId: rejectGovernanceChange
      tags: [Governance]
      summary: Reject a pending governance change
      parameters:
        - in: path
          name: changeId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceDecisionRequest"
      responses:
        "200":
          description: Rejected governance change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceChangeRecord"
        "409":
          description: Self decision, duplicate decision, or invalid state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/governance/changes/{changeId}/apply:
    post:
      operationId: applyGovernanceChange
      tags: [Governance]
      summary: Apply an approved change when the resource baseline still matches
      parameters:
        - in: path
          name: changeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Applied governance change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceChangeRecord"
        "409":
          description: Change is not approved or the resource baseline drifted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GovernanceChangeRecord"
                  - $ref: "#/components/schemas/Error"

  /api/audit-events:
    get:
      operationId: listSecurityAuditEvents
