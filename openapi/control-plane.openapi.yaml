  /api/sessions/{sessionId}/memory-recommendations/{recommendationId}/feedback:
    post:
      operationId: createSessionMemoryRecommendationFeedback
      tags: [Memory]
      summary: Record a content-free recommendation action and optionally activate an overlay
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: path
          name: recommendationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
