      tags: [RuntimeWorkspaceChanges]
      summary: Get a Runtime Worker workspace change set
      parameters:
        - in: path
          name: changeSetId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workspace change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceChangeSet"
        "404": { description: Not found }

  /api/runtime/workspace-change-sets/{changeSetId}/apply:
    post:
      tags: [RuntimeWorkspaceChanges]
      summary: Apply a reviewed workspace change set to its source workspace
      parameters:
        - in: path
          name: changeSetId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: Applied change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceChangeSet"
        "409": { description: Source workspace changed or change set is not pending }

  /api/runtime/workspace-change-sets/{changeSetId}/reject:
    post:
      tags: [RuntimeWorkspaceChanges]
      summary: Reject a pending workspace change set
      parameters:
        - in: path
          name: changeSetId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: Rejected change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceChangeSet"
        "409": { description: Change set is not pending }

  /api/approvals/{approvalId}/approve:
    post:
      tags: [Approvals]
      summary: Approve request
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: Approved

  /api/approvals/{approvalId}/reject:
    post:
      tags: [Approvals]
      summary: Reject request
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: Rejected

  /api/human-inputs:
    get:
      tags: [HumanInputs]
      summary: List pending human input requests
      responses:
        "200":
          description: Human input list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                required: [items]

  /api/human-inputs/{inputRequestId}/submit:
    post:
      tags: [HumanInputs]
      summary: Submit human input payload
      parameters:
        - in: path
          name: inputRequestId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanInputSubmitRequest"
      responses:
        "200":
          description: Submitted

  /api/internal/ops/execution/dispatch-sweep:
    post:
      tags: [InternalOps]
      summary: Trigger execution adapter dispatch maintenance sweep
      responses:
        "202":
          description: Maintenance triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionMaintenanceResult"
        "409":
          description: Maintenance unsupported for current adapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/planner/template-selection:
    post:
      tags: [Planner]
      summary: Recommend template for intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerTemplateSelectionRequest"
      responses:
        "200":
          description: Recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerTemplateSelectionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No published templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/planner/dag-draft:
    post:
      tags: [Planner]
      summary: Generate an editable DAG draft from intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerDagDraftRequest"
      responses:
        "200":
          description: DAG draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerDagDraftResponse"
        "400":
          description: Invalid request or draft generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Template not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/planner/candidate-plan:
    post:
      tags: [Planner]
      summary: Generate candidate plan under template constraints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerCandidatePlanRequest"
      responses:
        "200":
          description: Candidate plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerCandidatePlanResponse"
        "400":
          description: Invalid request or planning failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Template not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

