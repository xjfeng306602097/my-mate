name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/shared-types/package-lock.json
            services/runtime-worker/package-lock.json
            services/control-plane/package-lock.json
            services/api-gateway/package-lock.json
            services/execution-adapter/package-lock.json
            apps/cli/package-lock.json
            apps/mobile/package-lock.json
      - name: Install workspace dependencies
        run: |
          npm ci --prefix packages/shared-types
          npm ci --prefix services/runtime-worker
          npm ci --prefix services/control-plane
          npm ci --prefix services/api-gateway
          npm ci --prefix services/execution-adapter
          npm ci --prefix apps/cli
          npm ci --prefix apps/mobile
      - name: Check generated contracts and types
        run: npm run check
      - name: Run deterministic test suite
        run: npm test
